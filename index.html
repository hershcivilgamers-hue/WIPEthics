<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <!-- Installable PWA: manifest + theme, icon reused for the home-screen tile. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0A0C0D" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="AIC" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AIC — Automated Identity &amp; Clearance</title>

  <!-- IBM Plex — the registry type system: Serif (documents & headings),
       Sans (interface), Mono (designations, IDs, system voice). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet"
  />

  <!-- Stylesheets, loaded in cascade order: tokens first, detail last. -->
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/dossier.css" />
  <link rel="stylesheet" href="styles/surveillance.css" />
  <link rel="stylesheet" href="styles/tribunals.css" />
  <link rel="stylesheet" href="styles/compartments.css" />
  <link rel="stylesheet" href="styles/operations.css" />
  <link rel="stylesheet" href="styles/home.css" />
  <link rel="stylesheet" href="styles/console.css" />
</head>
<body>
  <!-- The application renders into this root. -->
  <div id="app"></div>

  <!-- Single module entry point; it imports everything else. -->
  <script type="module" src="js/app.js"></script>

  <!-- Register the service worker for installability + offline resilience.
       Failure is non-fatal — the app runs identically without it. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => { /* no PWA, no problem */ });
      });
    }
  </script>

  <!-- Shown only if the browser can't run ES modules (very old browsers). -->
  <noscript>
    <p style="color:#e2e6ec;font-family:sans-serif;padding:2rem;">
      AIC requires JavaScript. Please enable it to continue.
    </p>
  </noscript>
</body>
</html>
